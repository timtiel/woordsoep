; Optionele fallback-configuratie voor aqt op lastige netwerken.
; Gebruik: py tools\run_aqt.py -c tools\aqt-settings.ini install-qt ...
; Let op: INSECURE_NOT_FOR_PRODUCTION_ignore_hash schakelt de hash-controle uit.

[DEFAULTS]

[aqt]
baseurl: https://download.qt.io

[requests]
connection_timeout: 15
response_timeout: 60
max_retries_on_connection_error: 5
retry_backoff: 0.5
max_retries_on_checksum_error: 5
max_retries_to_retrieve_hash: 5
INSECURE_NOT_FOR_PRODUCTION_ignore_hash: True

[mirrors]
trusted_mirrors:
    https://download.qt.io
